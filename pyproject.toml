[project]
name = "research-agent-mcp-server"
version = "0.1.0"
description = "Integration Research Agent MCP Server - AI-powered developer integration architect."
requires-python = ">=3.11,<3.14"
readme = "project-specification.md"
dependencies = [
  "mcp>=1.2.0",
  "langgraph>=0.2.50",
  "langchain-core>=0.3.0",
  "mistralai>=1.2.0",
  "tavily-python>=0.5.0",
  "httpx>=0.27.0",
  "trafilatura>=1.12.0",
  "chromadb>=0.5.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.5.0",
  "numpy>=1.26.0",
  "pathspec>=0.12.0",
  "python-slugify>=8.0.0",
  "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
research-agent-mcp = "research_agent.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "B",
  "UP",
  "T20",
]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
